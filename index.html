<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VBDC MONITORING, RAMNAGAR-I</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7585;--ln:#e2e6ec;--ac:#1f6feb;--ok:#1a8a4a;--bad:#c9372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2b3340;--ac:#5b9bff;--ok:#4cc38a;--bad:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2b3340;--ac:#5b9bff;--ok:#4cc38a;--bad:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;max-width:100%}
input[type=number]{width:80px}input[type=checkbox]{width:auto}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button.s{padding:4px 8px;font-size:13px;background:transparent;color:var(--bad);border:1px solid var(--ln)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln);white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
.sc{font-weight:700;text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}
.scroll{overflow-x:auto}.full{width:100%}.ct a{text-decoration:none;font-size:18px;margin-right:6px}
.note{background:var(--bg);border:1px dashed var(--ln);border-radius:8px;padding:8px;font-size:13px;color:var(--mu)}

:root{--ac:#1b7a3a;--top:#dff1e5;--sh:0 2px 12px rgba(20,60,35,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#3fb868;--top:#16261c;--sh:none}}
:root[data-theme="dark"]{--ac:#3fb868;--top:#16261c;--sh:none}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--top),var(--bg) 260px);background-repeat:no-repeat}
.card{border-radius:16px;box-shadow:var(--sh)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,#145c2b,#2f9e57);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.banner h1{font-size:18px;letter-spacing:.3px}.banner .sub{opacity:.9;font-size:13px;margin-top:2px}.banner button{background:rgba(255,255,255,.22);padding:7px 12px}
.login{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:26px 18px;margin-top:8vh;box-shadow:var(--sh);text-align:center}
.login .full{margin-bottom:8px}.login .note{text-align:left}.logo{font-size:42px}
.tabs button{border-radius:20px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{padding:0;overflow:hidden}.sec .hd{padding:13px 14px;font-weight:700;font-size:16px;color:#fff}
.sec .hd small{display:block;font-weight:400;opacity:.92;font-size:12px;margin-top:2px}
.hd.poor{background:linear-gradient(135deg,#b3261e,#e55a4e)}.hd.best{background:linear-gradient(135deg,#145c2b,#2f9e57)}.hd.all{background:linear-gradient(135deg,#1d4f91,#3b82d6)}
.sec .bd{padding:4px 14px 10px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.rk{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.rk.best{background:#2f9e57}.rk.poor{background:#d9453a}
.in{flex:1;min-width:0}.nm2{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--ln);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.bar i.best{background:#2f9e57}.bar i.poor{background:#d9453a}
.rt{text-align:right}.sv{font-size:20px;font-weight:800;line-height:1.1}.sv.best{color:var(--ok)}.sv.poor{color:var(--bad)}.sv.low{color:var(--bad)}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px}

/* theme: light orange, red = poor, light green = best */
:root{--ac:#e8791a;--top:#ffe7cf;--ok:#1f8f4a;--bad:#d32f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#f59a45;--top:#2c1e10;--ok:#5fd18b;--bad:#ff6b63}}
:root[data-theme="dark"]{--ac:#f59a45;--top:#2c1e10;--ok:#5fd18b;--bad:#ff6b63}
.banner{background:linear-gradient(135deg,#ffb066,#ffd5a8);color:#4a2800}
.banner button{background:rgba(255,255,255,.6);color:#4a2800}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hd.all{background:linear-gradient(135deg,#ffb066,#ffd5a8);color:#4a2800}
.hd.poor{background:linear-gradient(135deg,#c62828,#ef5350);color:#fff}
.hd.best{background:linear-gradient(135deg,#a8e6b8,#cdf3d6);color:#14532d}
.rk.poor{background:#d32f2f}.rk.best{background:#8fd9a4;color:#14532d}
.bar i.poor{background:#d32f2f}.bar i.best{background:#8fd9a4}
.sv.poor,.sv.low{color:var(--bad)}.sv.best{color:var(--ok)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body><div class="wrap" id="app"></div>
<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,EmailAuthProvider,reauthenticateWithCredential,updatePassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBG6EeS9bfkpjmbBOZEVKpenlwpbQCbxUk",authDomain:"vbdc-ramnagar-i.firebaseapp.com",projectId:"vbdc-ramnagar-i",storageBucket:"vbdc-ramnagar-i.firebasestorage.app",messagingSenderId:"66954033456",appId:"1:66954033456:web:81f27bce2699c3574570f5"};
const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),fdb=getFirestore(fapp);
const ADMIN='7679199543',DOM='@vbdc-ramnagar.app',DEFPW='Admin@123',CC='91';
const ROLES={block:'Block Level Nodal Officer',dealing:'Block Level Dealing Official',gp:'GP Level Nodal Officer',bst:'VBDC Supervisor',sur:'VBDC Surveyor'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('en-CA');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const defDash=()=>({days:15,target:0,label:'Today survey count'});
let cfg={users:[],dash:defDash()},reports={},me=null,tab='',vDate=today(),msg='',umsg='',emsg='',rSup='',lp='',ready=false,dirty=false,unsubs=[],boot=false;
const sups=()=>cfg.users.filter(u=>u.role==='bst');
const team=sp=>cfg.users.filter(u=>u.role==='sur'&&u.sup===sp);
const val=e=>e.abs?0:(+e.a||0);
const fort=(sp,p,d)=>{const f=addDays(d,-(cfg.dash.days-1));let s=0;Object.values(reports).forEach(r=>{if(r.sup===sp&&r.date>=f&&r.date<=d){const e=r.entries.find(x=>x.p===p);if(e)s+=val(e)}});return s};
const saveCfg=()=>setDoc(doc(fdb,'settings','main'),{dash:cfg.dash}).catch(()=>{});
const refresh=()=>{if(me&&!dirty)draw()};

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;boot=false;dirty=false;cfg={users:[],dash:defDash()};reports={};
  if(!u){ready=true;draw();return}
  const ph=(u.email||'').split('@')[0],bad=()=>{msg='This number is not registered. Contact the Block Nodal Officer.';signOut(auth)};
  unsubs.push(onSnapshot(collection(fdb,'users'),sn=>{
    cfg.users=sn.docs.map(d=>d.data());
    const m=cfg.users.find(x=>x.phone===ph&&x.role!=='sur'),was=me;
    if(m)me=m;
    else if(ph===ADMIN){me={role:'block',name:'Block Nodal Officer',phone:ADMIN,desig:ROLES.block};
      if(!boot){boot=true;setDoc(doc(fdb,'users',ADMIN),{role:'block',name:'Block Nodal Officer',desig:ROLES.block,phone:ADMIN}).catch(()=>{})}}
    else return bad();
    ready=true;if(!was){tab='';dirty=false}refresh();
  },bad));
  unsubs.push(onSnapshot(doc(fdb,'settings','main'),d=>{if(d.exists()&&d.data().dash)cfg.dash={...defDash(),...d.data().dash};refresh()},()=>{}));
  unsubs.push(onSnapshot(collection(fdb,'reports'),sn=>{reports={};sn.docs.forEach(d=>{if(d.data().v===2)reports[d.id]=d.data()});refresh()},()=>{}));
});

function draw(){
  const a=document.getElementById('app');
  if(!ready){a.innerHTML='<div class="login"><div class="logo">📊</div><p class="mu">Loading…</p></div>';return}
  if(!me){dirty=false;a.innerHTML=loginView();bindLogin();return}
  const T={bst:[['entry','Daily entry'],['dash','Dashboard']],gp:[['dash','Dashboard']],dealing:[['dash','Dashboard']],
    block:[['dash','Dashboard'],['users','Users'],['reports','Reports'],['format','Format']]}[me.role].concat([['pw','Password']]);
  if(!tab||!T.find(t=>t[0]===tab))tab=T[0][0];
  const sp=tab==='reports'?(rSup||(sups()[0]||{}).phone):me.phone;
  a.innerHTML=`<div class="banner"><div><h1>VBDC MONITORING, RAMNAGAR-I</h1><div class="sub">${esc(me.name)} · ${ROLES[me.role]}</div></div><button id="out">Log out</button></div>
  <div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${tab==='entry'?entryView(sp,false):tab==='reports'?entryView(sp,true):tab==='dash'?dashView():tab==='users'?usersView():tab==='pw'?pwView():formatView()}`;
  document.getElementById('out').onclick=()=>signOut(auth);
  a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;umsg='';emsg='';draw()});
  if(tab==='entry'||tab==='reports')bindEntry(sp,tab==='reports');
  if(tab==='dash'){document.getElementById('dt').onchange=e=>{vDate=e.target.value||today();draw()};const f=document.getElementById('fr');if(f)f.onchange=e=>{cfg.dash.from=e.target.value;saveCfg();draw()}}
  if(tab==='users')bindUsers();if(tab==='format')bindFormat();if(tab==='pw')bindPw();
  dirty=false;a.oninput=()=>{dirty=true};
}

// ---------- Login ----------
function loginView(){
  return `<div class="login"><div class="logo">📊</div><h1>VBDC MONITORING, RAMNAGAR-I</h1><p class="mu">Log in with your mobile number and password.</p>
  <input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number (your ID)" class="full" value="${esc(lp)}">
  <input id="pw" type="password" placeholder="Password" class="full"><button id="go" class="full">Log in</button>
  <p class="bad">${esc(msg)}</p><div class="note">You stay logged in on this phone until you tap Log out. Forgot your password? Ask the Block Nodal Officer.</div></div>`;
}
function bindLogin(){
  const g=id=>document.getElementById(id);
  const go=async()=>{const p=g('ph').value.trim();lp=p;
    if(!/^\d{10}$/.test(p)||!g('pw').value){msg='Enter your 10-digit mobile number and password.';draw();return}
    g('go').disabled=true;g('go').textContent='Logging in…';
    try{await signInWithEmailAndPassword(auth,p+DOM,g('pw').value);msg=''}
    catch(e){msg=e.code==='auth/network-request-failed'?'No internet connection.':'Wrong mobile number or password.';draw()}};
  g('go').onclick=go;g('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}

// ---------- Password ----------
function pwView(){
  return `<div class="card"><h2>Change password</h2>
  <input id="p0" type="password" class="full" placeholder="Current password" style="margin-bottom:8px">
  <input id="p1" type="password" class="full" placeholder="New password (at least 6 characters)" style="margin-bottom:8px">
  <input id="p2" type="password" class="full" placeholder="Type the new password again" style="margin-bottom:8px">
  <button id="pb" class="full">Change password</button><p id="pm"></p></div>`;
}
function bindPw(){
  const g=id=>document.getElementById(id),say=(t,ok)=>{g('pm').className=ok?'ok':'bad';g('pm').textContent=t};
  g('pb').onclick=async()=>{
    if(g('p1').value.length<6)return say('New password must be at least 6 characters.');
    if(g('p1').value!==g('p2').value)return say('The two new passwords do not match.');
    try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,g('p0').value));
      await updatePassword(auth.currentUser,g('p1').value);say('✓ Password changed.',true);['p0','p1','p2'].forEach(i=>g(i).value='')}
    catch(e){say(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'?'Current password is wrong.':'Could not change password. Try again.')}};
}

// ---------- Entry (supervisor) / Report database (admin) ----------
function entryView(sp,adm){
  if(!sp)return '<div class="card">No supervisors found. Upload users first (Users tab).</div>';
  const sv=sups(),rid=vDate+'_'+sp,rep=reports[rid],tm=team(sp),D=cfg.dash;
  const get=p=>(rep&&rep.entries.find(e=>e.p===p))||{};
  return `<div class="card"><div class="row sp"><h2>${adm?'Report database':'Daily report'}</h2><input type="date" id="dt" value="${vDate}" max="${today()}"></div>
  ${adm?`<select id="ss" class="full" style="margin-bottom:8px">${sv.map(s=>`<option value="${s.phone}" ${s.phone===sp?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}
  <p class="mu">${rep?'Saved earlier. You can edit and save again.':'Not yet submitted for this date.'}</p>
  ${tm.length?`<div class="scroll"><table><tr><th>Surveyor</th><th>Absent</th><th>${esc(D.label)}</th><th>Last ${D.days} days</th></tr>
  ${tm.map(u=>{const e=get(u.phone);return `<tr data-p="${u.phone}"><td>${esc(u.name)}</td><td><input type="checkbox" class="abs" ${e.abs?'checked':''}></td><td><input type="number" class="pv" min="0" value="${e.a??''}"></td><td class="sc">${fort(sp,u.phone,vDate)}</td></tr>`}).join('')}</table></div>
  <button id="save" class="full" style="margin-top:12px">Save report</button>${adm&&rep?'<button id="del" class="g full" style="margin-top:8px">Delete this report</button>':''}`:'<p class="mu">No surveyors are assigned to this supervisor yet.</p>'}<p id="ok" class="ok">${esc(emsg)}</p></div>`;
}
function bindEntry(sp,adm){
  const g=id=>document.getElementById(id);
  g('dt').onchange=e=>{vDate=e.target.value||today();emsg='';draw()};
  if(g('ss'))g('ss').onchange=e=>{rSup=e.target.value;emsg='';draw()};
  if(g('save'))g('save').onclick=async()=>{
    const entries=[];
    document.querySelectorAll('tr[data-p]').forEach(tr=>{const u=cfg.users.find(x=>x.phone===tr.dataset.p);
      entries.push({p:u.phone,n:u.name,abs:tr.querySelector('.abs').checked,a:Math.max(0,Math.floor(+tr.querySelector('.pv').value||0))})});
    const rid=vDate+'_'+sp,d={v:2,date:vDate,sup:sp,entries,by:me.name};
    g('save').disabled=true;g('save').textContent='Saving…';
    try{await setDoc(doc(fdb,'reports',rid),d);reports[rid]=d;emsg='Saved ✓';dirty=false;draw()}
    catch(e){g('save').disabled=false;g('save').textContent='Save report';g('ok').className='bad';g('ok').textContent='Could not save ('+(e.code||'error')+'). Check internet and try again.'}};
  if(g('del'))g('del').onclick=async()=>{try{await deleteDoc(doc(fdb,'reports',vDate+'_'+sp));delete reports[vDate+'_'+sp];emsg='';dirty=false;draw()}catch(e){}};
}

// ---------- Dashboard ----------
function flat(from,to){const out=[];Object.values(reports).forEach(r=>{if(r.date>=from&&r.date<=to){
  const s=cfg.users.find(u=>u.phone===r.sup);
  r.entries.forEach(e=>{const u=cfg.users.find(x=>x.phone===e.p);if(u&&s)out.push({p:e.p,n:u.name,sup:s.name,d:r.date,t:val(e),abs:e.abs})})}});return out}
const ct=(p,n,txt)=>{if(me.role!=='block')return'';const t=encodeURIComponent('Hello '+n+', '+txt+' Please improve your daily survey work. - Block Nodal Officer');
  return `<span class="ct"><a href="tel:+${CC}${p}" target="_blank" rel="noopener">📞</a><a href="https://wa.me/${CC}${p}?text=${t}" target="_blank" rel="noopener">💬</a><a href="sms:+${CC}${p}?body=${t}" target="_blank" rel="noopener">✉️</a></span>`};
const tbl=rows=>rows.length?`<div class="scroll"><table>${rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map((c,j)=>`<td class="${j===r.length-1?'sc':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mu">No data yet.</p>';
const lst=(items,k)=>{if(!items.length)return'<p class="mu" style="padding:8px 0">No data yet.</p>';const mx=Math.max(1,...items.map(x=>x.v));
  return items.map((r,i)=>`<div class="it"><div class="rk ${k}">${i+1}</div><div class="in"><div class="nm2">${esc(r.n)}</div><div class="mu">${esc(r.sub)}</div><div class="bar"><i class="${k}" style="width:${Math.max(3,Math.round(r.v/mx*100))}%"></i></div></div><div class="rt"><div class="sv ${k}${r.low?' low':''}">${r.v}</div>${r.c||''}</div></div>`).join('')};
const sec=(k,title,sub,body)=>`<div class="card sec"><div class="hd ${k}">${title}${sub?`<small>${sub}</small>`:''}</div><div class="bd">${body}</div></div>`;
function dashView(){
  const D=cfg.dash,adm=me.role==='block',N=10,from=D.from||addDays(today(),-14);
  const grp=rows=>{const m={};rows.forEach(r=>{const x=m[r.p]=m[r.p]||{p:r.p,n:r.n,sup:r.sup,s:0,c:0};x.s+=r.t;x.c++});return Object.values(m)};
  const day=flat(vDate,vDate),per=grp(flat(from,vDate)),inc=grp(flat('0000-01-01','9999-12-31')).sort((a,b)=>b.s-a.s);
  const dI=r=>({n:r.n,sub:r.sup+(r.abs?' · absent':''),v:r.t,low:D.target>0&&r.t<D.target,c:adm?ct(r.p,r.n,'your survey count on '+vDate+' was '+r.t+'.'):''});
  const pI=(r,c)=>({n:r.n,sub:r.sup+' · '+r.c+' days · avg '+(r.s/r.c).toFixed(1),v:r.s,c:c&&adm?ct(r.p,r.n,'your total survey count from '+from+' to '+vDate+' is '+r.s+' (average '+(r.s/r.c).toFixed(1)+' per day).'):''});
  const dsc=day.slice().sort((a,b)=>b.t-a.t),asc=day.slice().sort((a,b)=>a.t-b.t),pd=per.slice().sort((a,b)=>b.s-a.s),pa=per.slice().sort((a,b)=>a.s-b.s);
  const dates=Object.values(reports).map(r=>r.date).sort(),tot=inc.reduce((s,r)=>s+r.s,0);
  const hint=adm?' · 📞 call · 💬 WhatsApp · ✉️ SMS':'';
  const table=inc.length?`<div class="scroll" style="max-height:480px;overflow-y:auto"><table><tr><th>#</th><th>Surveyor</th><th>Days</th><th>Avg</th><th class="sc">Total</th></tr>${inc.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}<div class="mu">${esc(r.sup)}</div></td><td>${r.c}</td><td>${(r.s/r.c).toFixed(1)}</td><td class="sc">${r.s}</td></tr>`).join('')}</table></div>`:'<p class="mu" style="padding:8px 0">No data yet.</p>';
  return `<div class="card datebar"><div><b>Report date</b><div class="mu">Dashboard shows data up to this day</div></div><input type="date" id="dt" value="${vDate}" max="${today()}"></div>
  ${sec('poor','⚠️ Today’s 10 poorest performers',vDate+hint,lst(asc.slice(0,N).map(dI),'poor'))}
  ${sec('best','🏆 Today’s 10 best performers',vDate,lst(dsc.slice(0,N).map(dI),'best'))}
  <div class="card datebar"><div><b>Period start date</b><div class="mu">${adm?'Choose the date to measure from':'Set by the Block Nodal Officer'}</div></div>${adm?`<input type="date" id="fr" value="${from}" max="${vDate}">`:`<b>${from}</b>`}</div>
  ${sec('poor','⚠️ 10 poorest performers since '+from,'Total '+esc(D.label)+', '+from+' to '+vDate+hint,lst(pa.slice(0,N).map(r=>pI(r,true)),'poor'))}
  ${sec('best','🏆 10 best performers since '+from,'Total '+esc(D.label)+', '+from+' to '+vDate,lst(pd.slice(0,N).map(r=>pI(r,false)),'best'))}
  ${sec('all','📈 Cumulative report since inception',dates.length?'From '+dates[0]+' · '+inc.length+' surveyors · '+tot+' total surveys':'',table)}`;
}

// ---------- Users (admin, Excel upload) ----------
function usersView(){
  const cnt=Object.keys(ROLES).map(k=>`${ROLES[k]}: <b>${cfg.users.filter(u=>u.role===k).length}</b>`).join(' · ');
  const order=Object.keys(ROLES);
  const list=cfg.users.slice().sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role));
  return `<div class="card"><h2>Upload users from Excel</h2>
  <p class="mu">First sheet, with columns: <b>Name</b>, <b>Designation</b>, <b>Phone Number</b>. For surveyors, add a 4th column <b>Supervisor Phone</b> (the phone number of their VBDC Supervisor). Designation must contain: Surveyor, Supervisor, GP Level Nodal, Block Level Dealing, or Block Level Nodal.</p>
  <p class="mu">Everyone except surveyors gets a login: <b>ID = phone number, starting password = ${DEFPW}</b>. Ask them to change it in the Password tab.</p>
  <button id="smp" class="g full" style="margin-bottom:8px">Download sample Excel file</button>
  <select id="mode" class="full" style="margin-bottom:8px"><option value="add">Add new / update existing</option><option value="rep">Replace all (delete everyone not in the file, except me)</option></select>
  <input type="file" id="fx" class="full" accept=".xlsx,.xls,.csv"><p class="${umsg.startsWith('✓')?'ok':'bad'}">${esc(umsg)}</p>
  <button id="mk" class="g full">Create missing logins</button></div>
  <div class="card"><h2>All users</h2><p class="mu">${cnt}</p><div class="scroll" style="max-height:420px;overflow-y:auto"><table>
  ${list.map(u=>{const s=cfg.users.find(x=>x.phone===u.sup);return `<tr><td>${esc(u.name)}<div class="mu">${esc(u.desig||ROLES[u.role])}</div></td><td>${u.phone}${u.role==='sur'?`<div class="mu">${s?esc(s.name):'⚠ no supervisor'}</div>`:''}</td><td>${u.phone===me.phone?'':`<button class="s" data-d="${u.phone}">Remove</button>`}</td></tr>`}).join('')}</table></div></div>`;
}
const roleOf=d=>{d=d.toLowerCase();return /surveyor/.test(d)?'sur':/supervisor/.test(d)?'bst':/dealing/.test(d)?'dealing':/gp/.test(d)?'gp':/nodal|block/.test(d)?'block':''};
async function makeLogins(list){
  const app2=initializeApp(firebaseConfig,'s'+Date.now()),sa=getAuth(app2);let made=0,fail=0;
  for(const r of list){try{await createUserWithEmailAndPassword(sa,r.phone+DOM,DEFPW);made++;await signOut(sa)}catch(e){if(e.code!=='auth/email-already-in-use')fail++}}
  await deleteApp(app2);return{made,fail};
}
function bindUsers(){
  const g=id=>document.getElementById(id),say=t=>{umsg=t;draw()};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await deleteDoc(doc(fdb,'users',b.dataset.d));say('✓ User removed. They can no longer see any data.')}catch(e){say('Could not remove this user.')}});
  g('mk').onclick=async()=>{say('Working…');const r=await makeLogins(cfg.users.filter(u=>u.role!=='sur'));say(`✓ ${r.made} new logins created.`+(r.fail?` ${r.fail} failed.`:''))};
  g('smp').onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([['Name','Designation','Phone Number','Supervisor Phone'],['Ramesh Das','VBDC Supervisor','9000000011',''],['Sita Roy','VBDC Surveyor','8000000001','9000000011'],['Block Dealing Name','Block Level Dealing Official','9000000004',''],['GP Nodal Name','GP Level Nodal Officer','9000000003','']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Users');XLSX.writeFile(wb,'users-sample.xlsx')};
  g('fx').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(typeof XLSX==='undefined'){say('Excel reader could not load. Check the internet connection and retry.');return}
    const mode=g('mode').value,r=new FileReader();
    r.onload=async ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const pick=(o,keys)=>{for(const k in o)if(keys.includes(k.toLowerCase().replace(/[^a-z]/g,'')))return String(o[k]).trim();return''};
      const dg=s=>String(s).replace(/\D/g,'').slice(-10);
      const map=new Map();let skipped=0,nosup=0;
      rows.forEach(o=>{
        const name=pick(o,['name']),d=pick(o,['designation','role']),p=dg(pick(o,['phone','phonenumber','mobile','mobilenumber','mobileno','phoneno'])),role=roleOf(d);
        const sup=dg(pick(o,['supervisorphone','supervisormobile','supervisor']));
        if(!name||p.length!==10||!role||p===me.phone){skipped++;return}
        if(role==='sur'&&!sup)nosup++;
        const rec={role,name,desig:d||ROLES[role],phone:p};if(role==='sur'&&sup)rec.sup=sup;
        map.set(p,rec)});
      say('Working…');
      const ops=[];
      if(mode==='rep')cfg.users.forEach(u=>{if(u.phone!==me.phone&&!map.has(u.phone))ops.push(['d',u.phone])});
      map.forEach(r=>ops.push(['s',r]));
      for(let i=0;i<ops.length;i+=400){const b=writeBatch(fdb);
        ops.slice(i,i+400).forEach(o=>o[0]==='d'?b.delete(doc(fdb,'users',o[1])):b.set(doc(fdb,'users',o[1].phone),o[1]));await b.commit()}
      const lg=await makeLogins([...map.values()].filter(x=>x.role!=='sur'));
      say(`✓ ${map.size} users saved, ${skipped} rows skipped (missing name, bad phone or unknown designation). ${lg.made} new logins created.`+(lg.fail?` ${lg.fail} logins failed.`:'')+(nosup?` ${nosup} surveyors have no supervisor phone.`:''));
    }catch(err){say('Could not read or save this file ('+(err.code||'error')+').')}};
    r.readAsArrayBuffer(f);
  };
}

<body><div class="wrap" id="app"></div>
<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,EmailAuthProvider,reauthenticateWithCredential,updatePassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,deleteField,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBG6EeS9bfkpjmbBOZEVKpenlwpbQCbxUk",authDomain:"vbdc-ramnagar-i.firebaseapp.com",projectId:"vbdc-ramnagar-i",storageBucket:"vbdc-ramnagar-i.firebasestorage.app",messagingSenderId:"66954033456",appId:"1:66954033456:web:81f27bce2699c3574570f5"};
const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),fdb=getFirestore(fapp);
const ADMIN='7679199543',DOM='@vbdc-ramnagar.app',DEFPW='Admin@123',CC='91';
const ROLES={block:'Block Level Nodal Officer',dealing:'Block Level Dealing Official',gp:'GP Level Nodal Officer',bst:'VBDC Supervisor',sur:'VBDC Surveyor'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('en-CA');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const DEFMSG='Hello {name}, your survey count for {date} was {count} (average {avg} per day). Your name appeared in the poor performance list {poorFN} time(s) and in the average below {limit} list {lowFN} time(s) in this fortnight ({fn}). Please improve your daily survey work. - Block Nodal Officer';
const DEFGMSG='Dear all, please improve your daily survey work and upload your reports on time. - Krishnendu Mallick, Block Nodal Officer';
const DEFSMSG='Hello {name}, the survey report for {date} has not been uploaded yet. Please upload it today. - Krishnendu Mallick, Block Nodal Officer';
const SPA=[['pe','Perennial Spots','No of Perennial Spots Cleanliness Activity'],['mk','Market','No of Market Cleanliness Activity'],['sc','School','No of School Cleanliness Activity'],['ic','ICDS','No of ICDS Cleanliness Activity'],['hc','Health Centre','No of Health Centre Cleanliness Activity'],['go','Govt. Office','No of Government office Cleanliness Activity']];
const BACKMSG='Supervisors can enter only today’s and yesterday’s report. For an older date, ask the Block Nodal Officer.';
const DEFSPMSG='Hello {name}, the special activity report for {date} has not been uploaded yet. Please upload it today. - Krishnendu Mallick, Block Nodal Officer';
const DPARAMS=[['overview','Overview with charts'],['search','Find a surveyor (search)'],['sup-status','Today’s survey report uploaded? (YES/NO)'],['sp-status','Special activity report updated? (YES/NO)'],['today-poor','Today’s 10 poorest performers'],['today-best','Today’s 10 best performers'],['period-poor','10 poorest since the period start date'],['period-best','10 best since the period start date'],['avg-low','Daily average below the limit'],['freq','Times in poorest-10 / below limit / best-10 lists (Nodal Officer only)'],['today-all','Today’s total report (all VST)'],['period-all','Cumulative report from the period start date'],['inception','Cumulative report since inception'],['sp-daily','Daily special activity report'],['sp-period','Cumulative special activity from a chosen date'],['sp-inc','Cumulative special activity since inception']];
const DEFSHOW=['overview','search','sup-status'];
const DEFMMSG='Hello {name}, this is a message from the Block Nodal Officer office. - Krishnendu Mallick, Block Nodal Officer';
const defDash=()=>({days:15,target:0,label:'Today survey count',avgMin:20,msg:DEFMSG,smsg:DEFSMSG,spmsg:DEFSPMSG});
const fillMsg=(n,v,t)=>{const tpl=t||cfg.dash.msg||DEFMSG,z=x=>x===undefined?'':x;
  let m=tpl.replace(/\{name\}/g,n).replace(/\{date\}/g,z(v.date)).replace(/\{count\}/g,z(v.count)).replace(/\{avg\}/g,z(v.avg)).replace(/\{limit\}/g,z(v.limit)).replace(/\{fn\}/g,z(v.fn)).replace(/\{badFN\}/g,z(v.badFN)).replace(/\{badAll\}/g,z(v.badAll)).replace(/\{poorFN\}/g,z(v.poorFN)).replace(/\{poorAll\}/g,z(v.poorAll)).replace(/\{lowFN\}/g,z(v.lowFN)).replace(/\{lowAll\}/g,z(v.lowAll)).replace(/\{topFN\}/g,z(v.topFN)).replace(/\{topAll\}/g,z(v.topAll));
  if(v.badFN!==undefined&&!/\{(badFN|badAll|poorFN|poorAll|lowFN|lowAll)\}/.test(tpl))m+=' Your name appeared in the poor performance list '+v.poorFN+' time(s) and in the average below '+v.limit+' list '+v.lowFN+' time(s) in this fortnight ('+v.fn+').';
  return m};
let editU=null,fmsg='',spOk='';
let cfg={users:[],dash:defDash()},reports={},me=null,tab='',vDate=today(),msg='',umsg='',emsg='',rSup='',lp='',ready=false,dirty=false,unsubs=[],boot=false;
const sups=()=>cfg.users.filter(u=>u.role==='bst');
const gpName=u=>{if(!u)return'';if(u.gp)return u.gp;const d=u.desig||'',i=d.indexOf('-');return i>0?d.slice(i+1).trim():u.name};
const team=sp=>cfg.users.filter(u=>u.role==='sur'&&u.sup===sp);
const val=e=>+e.a||0;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fortStart=d=>d.slice(0,8)+(+d.slice(8,10)<=15?'01':'16');
const fortLabel=d=>{const first=+d.slice(8,10)<=15,last=new Date(+d.slice(0,4),+d.slice(5,7),0).getDate();return (first?'1-15 ':'16-'+last+' ')+MON[+d.slice(5,7)-1]};
const fort=(sp,p,d)=>{const f=fortStart(d);let s=0;Object.values(reports).forEach(r=>{if(r.sup===sp&&r.date>=f&&r.date<=d){const e=(r.entries||[]).find(x=>x.p===p);if(e)s+=val(e)}});return s};
const saveCfg=()=>setDoc(doc(fdb,'settings','main'),{dash:cfg.dash}).catch(()=>{});
const refresh=()=>{if(me&&!dirty)draw()};

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;boot=false;dirty=false;cfg={users:[],dash:defDash()};reports={};
  if(!u){ready=true;draw();return}
  const ph=(u.email||'').split('@')[0],bad=()=>{msg='This number is not registered. Contact the Block Nodal Officer.';signOut(auth)};
  unsubs.push(onSnapshot(collection(fdb,'users'),sn=>{
    cfg.users=sn.docs.map(d=>d.data());
    const m=cfg.users.find(x=>x.phone===ph&&x.role!=='sur'),was=me;
    if(m){me=m;if(ph===ADMIN&&m.name==='Block Nodal Officer'&&!boot){boot=true;setDoc(doc(fdb,'users',ADMIN),{...m,name:'Krishnendu Mallick'}).catch(()=>{})}}
    else if(ph===ADMIN){me={role:'block',name:'Block Nodal Officer',phone:ADMIN,desig:ROLES.block};
      if(!boot){boot=true;setDoc(doc(fdb,'users',ADMIN),{role:'block',name:'Krishnendu Mallick',desig:ROLES.block,phone:ADMIN}).catch(()=>{})}}
    else return bad();
    ready=true;if(!was){tab='';dirty=false}refresh();
  },bad));
  unsubs.push(onSnapshot(doc(fdb,'settings','main'),d=>{if(d.exists()&&d.data().dash)cfg.dash={...defDash(),...d.data().dash};refresh()},()=>{}));
  unsubs.push(onSnapshot(collection(fdb,'reports'),sn=>{reports={};sn.docs.forEach(d=>{if(d.data().v===2)reports[d.id]=d.data()});refresh()},()=>{}));
});

function draw(){
  const a=document.getElementById('app');
  if(!ready){a.innerHTML='<div class="login"><div class="logo">📊</div><p class="mu">Loading…</p></div>';return}
  if(!me){dirty=false;a.innerHTML=loginView();bindLogin();return}
  const T={bst:[['entry','Daily entry'],['sp','Special activity'],['dash','Dashboard']],gp:[['dash','Dashboard']],dealing:[['dash','Dashboard'],['bulk','Message manager']],
    block:[['dash','Dashboard'],['bulk','Message manager'],['users','Users'],['reports','Reports']]}[me.role].concat([['pw','Password']]);
  if(!tab||!T.find(t=>t[0]===tab))tab=T[0][0];
  const sp=tab==='reports'?(rSup||(sups()[0]||{}).phone):me.phone;
  a.innerHTML=`<div class="banner"><div><h1>VBDC MONITORING, RAMNAGAR-I</h1><div class="sub">${esc(me.name)} · ${ROLES[me.role]}</div></div><button id="out">Log out</button></div>
  <div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${tab==='entry'?entryView(sp,false):tab==='sp'?spView(sp,false,true):tab==='reports'?reportsView(sp):tab==='dash'?dashView():tab==='users'?usersView():tab==='bulk'?msgManagerView():tab==='pw'?pwView():formatView()}
  <div class="mu" style="text-align:center;padding:16px 0 8px">App version 17 · message manager</div>`;
  document.getElementById('out').onclick=()=>{Q=null;srch.open=null;renderQ();signOut(auth)};
  a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(me.role==='bst'&&(tab==='entry'||tab==='sp')&&vDate<addDays(today(),-1))vDate=today();umsg='';emsg='';spOk='';draw()});
  if(tab==='entry')bindEntry(sp,false);if(tab==='sp')bindSp(sp,false,true);if(tab==='reports'){a.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{repSub=b.dataset.rs;draw()});if(repSub==='entries'){bindEntry(sp,true);bindSp(sp,true,false)}else bindParams()}
  if(tab==='dash'){document.getElementById('dt').onchange=e=>{vDate=e.target.value||today();draw()};const f=document.getElementById('fr');if(f)f.onchange=e=>{cfg.dash.from=e.target.value;saveCfg();draw()};const sfi=document.getElementById('sf');if(sfi)sfi.onchange=e=>{cfg.dash.spFrom=e.target.value;saveCfg();draw()};const cb=document.getElementById('ctb');if(cb)cb.onclick=()=>{contactOn=!contactOn;try{localStorage.setItem('contactOn',contactOn?'1':'0')}catch(e){}draw()};a.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>dl(b.dataset.x,b.dataset.f));a.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const i=b.dataset.h;hid.has(i)?hid.delete(i):hid.add(i);try{localStorage.setItem('hid',JSON.stringify([...hid]))}catch(e){}draw()});a.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const d=QD[b.dataset.q];if(!d)return;Q={title:d.title,ch:'wa',group:cfg.dash.gmsg||DEFGMSG,items:d.items.map(x=>({...x,done:false}))};renderQ()});if(document.getElementById('sq'))bindSearch();const sbk=document.getElementById('sback');if(sbk)sbk.onclick=()=>{srch.open=null;draw();const el=document.getElementById('srch');if(el)el.scrollIntoView()};a.querySelectorAll('[data-miss]').forEach(b=>b.onclick=()=>{const k=b.dataset.miss;ovMiss[k]=!ovMiss[k];draw()})}
  if(tab==='bulk')bindMsgMgr();if(tab==='users')bindUsers();if(tab==='format')bindFormat();if(tab==='pw')bindPw();
  dirty=false;a.oninput=()=>{dirty=true};
}

// ---------- Login ----------
function loginView(){
  return `<div class="login"><div class="logo">📊</div><h1>VBDC MONITORING, RAMNAGAR-I</h1><p class="mu">Log in with your mobile number and password.</p>
  <input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number (your ID)" class="full" value="${esc(lp)}">
  <input id="pw" type="password" placeholder="Password" class="full"><button id="go" class="full">Log in</button>
  <p class="bad">${esc(msg)}</p><div class="note">You stay logged in on this phone until you tap Log out. Forgot your password? Ask the Block Nodal Officer.</div></div>`;
}
function bindLogin(){
  const g=id=>document.getElementById(id);
  const go=async()=>{const p=g('ph').value.trim();lp=p;
    if(!/^\d{10}$/.test(p)||!g('pw').value){msg='Enter your 10-digit mobile number and password.';draw();return}

async function makeLogins(list){
  const app2=initializeApp(firebaseConfig,'s'+Date.now()),sa=getAuth(app2);let made=0,fail=0;
  for(const r of list){try{await createUserWithEmailAndPassword(sa,r.phone+DOM,DEFPW);made++;await signOut(sa)}catch(e){if(e.code!=='auth/email-already-in-use')fail++}}
  await deleteApp(app2);return{made,fail};
}
function bindUsers(){
  const g=id=>document.getElementById(id),say=t=>{umsg=t;draw()};
  const upd=()=>{const r=g('ur').value;g('us').style.display=r==='sur'?'':'none';g('ug').style.display=r==='bst'?'':'none'};g('ur').onchange=upd;upd();
  const err=t=>{g('uf').className='bad';g('uf').textContent=t};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editU=b.dataset.e;fmsg='';draw();window.scrollTo(0,0)});
  if(g('ucn'))g('ucn').onclick=()=>{editU=null;fmsg='';draw()};
  g('usv').onclick=async()=>{
    const name=g('un').value.trim(),ph=g('up').value.replace(/\D/g,'').slice(-10),role=editU&&editU===me.phone?'block':g('ur').value,old=cfg.users.find(u=>u.phone===ph);
    if(!name||ph.length!==10)return err('Enter a name and a 10-digit phone number.');
    if(role==='sur'&&!g('us').value)return err('Choose the supervisor for this surveyor.');
    if(!editU&&old)return err('This phone number already exists. Tap Edit beside it to change it.');
    const rec={role,name,desig:old&&old.role===role&&old.desig?old.desig:ROLES[role],phone:ph};
    if(role==='sur')rec.sup=g('us').value;if(role==='bst'&&g('ug').value.trim())rec.gp=g('ug').value.trim();
    try{await setDoc(doc(fdb,'users',ph),rec);let x='';if(role!=='sur'){const r=await makeLogins([rec]);if(r.made)x=' Login created (password '+DEFPW+').'}editU=null;fmsg='✓ Saved.'+x;draw()}
    catch(e){err('Could not save ('+(e.code||'error')+').')}};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await deleteDoc(doc(fdb,'users',b.dataset.d));say('✓ User removed. They can no longer see any data.')}catch(e){say('Could not remove this user.')}});
  g('mk').onclick=async()=>{say('Working…');const r=await makeLogins(cfg.users.filter(u=>u.role!=='sur'));say(`✓ ${r.made} new logins created.`+(r.fail?` ${r.fail} failed.`:''))};
  g('smp').onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([['Name','Designation','Phone Number','Supervisor Phone'],['Ramesh Das','VBDC Supervisor','9000000011',''],['Sita Roy','VBDC Surveyor','8000000001','9000000011'],['Block Dealing Name','Block Level Dealing Official','9000000004',''],['GP Nodal Name','GP Level Nodal Officer','9000000003','']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Users');XLSX.writeFile(wb,'users-sample.xlsx')};
  g('fx').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(typeof XLSX==='undefined'){say('Excel reader could not load. Check the internet connection and retry.');return}
    const mode=g('mode').value,r=new FileReader();
    r.onload=async ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const pick=(o,keys)=>{for(const k in o)if(keys.includes(k.toLowerCase().replace(/[^a-z]/g,'')))return String(o[k]).trim();return''};
      const dg=s=>String(s).replace(/\D/g,'').slice(-10);
      const map=new Map();let skipped=0,nosup=0;
      rows.forEach(o=>{
        const name=pick(o,['name']),d=pick(o,['designation','role']),p=dg(pick(o,['phone','phonenumber','mobile','mobilenumber','mobileno','phoneno'])),role=roleOf(d);
        const sup=dg(pick(o,['supervisorphone','supervisormobile','supervisor'])),gp=pick(o,['gpname','gp','grampanchayat','grampanchayatname']);
        if(!name||p.length!==10||!role||p===me.phone){skipped++;return}
        if(role==='sur'&&!sup)nosup++;
        const rec={role,name,desig:d||ROLES[role],phone:p};if(role==='sur'&&sup)rec.sup=sup;if(role==='bst'&&gp)rec.gp=gp;
        map.set(p,rec)});
      say('Working…');
      const ops=[];
      if(mode==='rep')cfg.users.forEach(u=>{if(u.phone!==me.phone&&!map.has(u.phone))ops.push(['d',u.phone])});
      map.forEach(r=>ops.push(['s',r]));
      for(let i=0;i<ops.length;i+=400){const b=writeBatch(fdb);
        ops.slice(i,i+400).forEach(o=>o[0]==='d'?b.delete(doc(fdb,'users',o[1])):b.set(doc(fdb,'users',o[1].phone),o[1]));await b.commit()}
      const lg=await makeLogins([...map.values()].filter(x=>x.role!=='sur'));
      say(`✓ ${map.size} users saved, ${skipped} rows skipped (missing name, bad phone or unknown designation). ${lg.made} new logins created.`+(lg.fail?` ${lg.fail} logins failed.`:'')+(nosup?` ${nosup} surveyors have no supervisor phone.`:''));
    }catch(err){say('Could not read or save this file ('+(err.code||'error')+').')}};
    r.readAsArrayBuffer(f);
  };
}

function formatView(){
  const D=cfg.dash;
  return `<div class="card"><h2>Dashboard settings</h2>
  <label>Count column name<br><input id="fl" class="full" value="${esc(D.label)}"></label>
  <div class="row" style="margin-top:8px"><label>Daily target (0 = none)<br><input id="fg" type="number" min="0" value="${D.target}"></label><label>Low average limit<br><input id="fa" type="number" min="1" value="${D.avgMin}"></label></div>
  <p class="mu">The dashboard always shows 10 names per list. Choose the period start date on the Dashboard tab.</p>
  <button id="sf" class="full" style="margin-top:12px">Save settings</button><p id="ok" class="ok"></p></div>`;
}
function bindFormat(){
  document.getElementById('sf').onclick=()=>{
    const g=id=>document.getElementById(id),D=cfg.dash;
    D.label=g('fl').value.trim()||D.label;D.target=Math.max(0,+g('fg').value||0);D.avgMin=Math.max(1,+g('fa').value||20);
    saveCfg();g('ok').textContent='Saved ✓';
  };
}
